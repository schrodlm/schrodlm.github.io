body{margin:0;background:#F1ECDF}

.iso-plate{position:relative;width:100%;aspect-ratio:1170/1000;overflow:hidden}
.iso-plate img{position:absolute;image-rendering:pixelated;pointer-events:none}
.iso-hit{position:absolute;padding:0;border:0;background:transparent;cursor:pointer}
.iso-hit:focus-visible{outline:none;background:rgba(43,115,73,0.12)}
.iso-cap{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;pointer-events:none;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;line-height:15px;padding:1px 4px;background:rgba(241,236,223,0.92);z-index:80}
.iso-no{position:absolute;transform:translate(0,-50%);pointer-events:none;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;font-weight:600;line-height:16px;width:16px;text-align:center;border:1px solid currentColor;border-radius:50%;background:#F1ECDF;z-index:75}
.iso-card{position:absolute;right:2.2%;top:3.4%;width:300px;z-index:90}
.iso-key{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:2px 24px;margin:14px 0 0;padding:0;list-style:none}

.iso-key button:hover .iso-kn,.iso-key button:focus-visible .iso-kn{text-decoration:underline}

<script type="text/x-dc" data-dc-script data-props='{"motion":{"editor":"boolean","default":true,"section":"Flora"},"$preview":{"width":1280,"height":1900}}'>
class Component extends DCLogic {
  state = { tick: 0, hover: '', sel: '', ex: false, v: { load: 0, panel: 0 } };

  componentDidMount() {
    this.boot();
    return;
    const reduce = typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) return;
    this.timer = setInterval(() => {
      if (this.props.motion === false) return;
      this.setState({ tick: this.state.tick + 1 });
    }, 250);
  }

  componentWillUnmount() { clearInterval(this.timer); }

  rng(seed) {
    let h = 1779033703 ^ seed.length;
    for (let i = 0; i < seed.length; i++) { h = Math.imul(h ^ seed.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
    let a = h >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  grid(w, h) {
    const chars = [], cols = [];
    for (let y = 0; y < h; y++) { chars.push(new Array(w).fill(' ')); cols.push(new Array(w).fill('')); }
    const put = (x, y, ch, c) => { if (x >= 0 && x < w && y >= 0 && y < h && ch !== ' ') { chars[y][x] = ch; cols[y][x] = c; } };
    return { chars, cols, put, w, h };
  }

  toRows(g) {
    const rows = [];
    for (let y = 0; y < g.h; y++) {
      const runs = []; let t = '', cur = null;
      for (let x = 0; x < g.w; x++) {
        const ch = g.chars[y][x];
        const key = ch === ' ' ? '' : g.cols[y][x];
        if (cur === null) cur = key;
        else if (key !== cur) { runs.push({ t, c: cur || 'transparent' }); t = ''; cur = key; }
        t += ch;
      }
      runs.push({ t, c: cur || 'transparent' });
      rows.push({ runs });
    }
    return rows;
  }

  // The home page's wind: one gust for every plant, so they all lean the same way.
  wind() {
    const t = this.state.tick * 0.25;
    return 0.75 * Math.sin(t * 0.55) + 0.35 * Math.sin(t * 0.21) + 0.45;
  }

  // ---- specimens: every post and note grows its own flower from its seed ----

  heads() {
    return [
      { rows: ['\\|/', '-@-', '/|\\'], genus: 'Radiantia', name: 'sunburst' },
      { rows: [' * ', '*o*', ' * '], genus: 'Stellaria', name: 'star' },
      { rows: ['.-.', '(o)', "'-'"], genus: 'Globularia', name: 'globe' },
      { rows: ['\\ /', '-*-', '/ \\'], genus: 'Asteriscus', name: 'asterisk' },
      { rows: [' ^ ', '/@\\'], genus: 'Tulipa', name: 'tulip' },
      { rows: ['o@o', '@o@'], genus: 'Racemosa', name: 'cluster' },
      { rows: [' , ', '(@)'], genus: 'Nutans', name: 'nodding cup' },
      { rows: ['.:.', '(*)'], genus: 'Pollinaria', name: 'pollen cup' },
      { rows: ['{*}'], genus: 'Orchidea', name: 'orchid' },
      { rows: ['(@)'], genus: 'Ocellus', name: 'eye' }
    ];
  }

  specimen(slug) {
    this._spec = this._spec || {};
    if (this._spec[slug]) return this._spec[slug];
    const r = this.rng('flower:' + slug), heads = this.heads();
    const petals = [['hibiscus', '#C24E39'], ['orchid', '#8A4F98'], ['mango', '#A87400'], ['lagoon', '#2A7099'], ['rose', '#B5476E']];
    const centers = [['mango', '#A87400'], ['ink', '#1F2B23'], ['hibiscus', '#C24E39']];
    const head = heads[Math.floor(r() * heads.length)];
    const petal = petals[Math.floor(r() * petals.length)];
    let center = centers[Math.floor(r() * centers.length)];
    if (center[1] === petal[1]) center = centers[1];
    const h = 6 + Math.floor(r() * 5), stiff = 0.7 + r() * 0.6, habit = r();
    const lean = habit < 0.33 ? -1 : habit > 0.66 ? 1 : 0;
    const style = ['fern', 'alternate', 'sparse'][Math.floor(r() * 3)];
    const leaves = [];
    for (let k = 1; k < h; k++) {
      if (style === 'fern' && r() < 0.7) leaves.push({ k, both: true });
      else if (style === 'alternate' && k % 2 === 1) leaves.push({ k, side: k % 4 === 1 ? -1 : 1 });
      else if (style === 'sparse' && r() < 0.25) leaves.push({ k, side: r() < 0.5 ? -1 : 1 });
    }
    const words = slug.split(/[-/]/).filter((w) => w.length >= 4 && !/^[0-9]+$/.test(w) && w !== 'notes' && w !== 'posts');
    const word = words.length ? words[Math.floor(r() * words.length)] : (slug.replace(/[^a-z]/g, '') || 'anonym');
    const species = word.replace(/[aeiouy]+$/, '') + ['ensis', 'ica', 'alis', 'ia'][Math.floor(r() * 4)];
    let fnv = 2166136261;
    for (let i = 0; i < slug.length; i++) { fnv ^= slug.charCodeAt(i); fnv = Math.imul(fnv, 16777619); }
    const seed = (fnv >>> 0).toString(16).padStart(8, '0');
    const hasCenter = head.rows.join('').match(/[@o]/) !== null;
    this._spec[slug] = { slug, head, petal, center: hasCenter ? center : null, h, stiff, lean, style, leaves, latin: head.genus + ' ' + species, seed };
    return this._spec[slug];
  }

  // Draw a plant standing at column x with its stem's foot on row base, bending in the wind.
  drawPlant(g, p, x, base, wind) {
    const amp = (p.h >= 7 ? 1.6 : 1.1) * p.stiff;
    const off = (k) => Math.round((amp * wind + (p.lean || 0) * 0.8) * Math.pow(k / p.h, 1.6));
    for (let k = 0; k < p.h; k++) {
      const d = k === 0 ? 0 : off(k) - off(k - 1);
      g.put(x + off(k), base - k, d > 0 ? '/' : d < 0 ? '\\' : '|', '#2B7349');
    }
    for (const l of p.leaves) {
      const y = base - l.k, sx = x + off(l.k);
      if (l.both) { g.put(sx - 1, y, '\\', '#3F8A52'); g.put(sx + 1, y, '/', '#3F8A52'); }
      else g.put(sx + l.side, y, l.side < 0 ? '\\' : '/', '#3F8A52');
    }
    const topX = x + off(p.h);
    if (p.fern) { g.put(topX, base - p.h, "'", '#3F8A52'); return; }
    const rows = p.head.rows;
    rows.forEach((line, i) => {
      const half = Math.floor(line.length / 2);
      for (let j = 0; j < line.length; j++) {
        const ch = line[j];
        g.put(topX - half + j, base - p.h - (rows.length - 1) + i, ch, (ch === '@' || ch === 'o') && p.center ? p.center[1] : p.petal[1]);
      }
    });
  }

  // A specimen alone, with a little soil under it.
  specimenRows(slug) {
    const p = this.specimen(slug), H = p.h + p.head.rows.length + 2, W = 15, g = this.grid(W, H);
    for (let x = 3; x < 12; x++) { g.put(x, H - 1, x % 2 ? '_' : '.', '#7A5C42'); if (x % 3 === 0) g.put(x, H - 2, ',', '#5E8E4A'); }
    this.drawPlant(g, p, 7, H - 2, this.wind());
    return this.toRows(g);
  }

  // The flower's most telling row, as a small mark beside a title.
  mark(slug) {
    const p = this.specimen(slug), rows = p.head.rows;
    const row = (rows.find((r) => /[@o*]/.test(r)) || rows[0]).trim();
    return row.split('').map((ch) => ({ t: ch, c: (ch === '@' || ch === 'o') && p.center ? p.center[1] : p.petal[1] }));
  }

  // The museum label: what the seed grew into.
  label(slug, no, title, date) {
    const p = this.specimen(slug);
    const key = (k) => k + ' ' + '.'.repeat(Math.max(2, 9 - k.length));
    const habit = p.lean < 0 ? 'leaning west' : p.lean > 0 ? 'leaning east' : 'upright';
    const leaves = p.leaves.length === 0 ? 'bare stem' : (p.style === 'fern' ? 'fern pairs' : p.style) + ' × ' + p.leaves.length;
    return {
      no, title, date, slug, latin: p.latin,
      lines: [
        { k: key('head'), v: p.head.name + '   ' + p.head.rows.map((r) => r.trim()).join(' ') },
        { k: key('petals'), v: p.petal[0] + (p.center ? ', ' + p.center[0] + ' centre' : '') },
        { k: key('stem'), v: p.h + ' rows, ' + habit },
        { k: key('leaves'), v: leaves },
        { k: key('seed'), v: '0x' + p.seed }
      ]
    };
  }

  // ---- the home page's soil and trailing vines, unchanged ----

  roots() {
    if (this._roots) return this._roots;
    const r = this.rng('roots');
    const W = 190, H = 8;
    const g = this.grid(W, H);
    for (let x = 0; x < W; x++) {
      if (r() < 0.4) g.put(x, 0, [',', "'", '"', 'v'][Math.floor(r() * 4)], '#5E8E4A');
      g.put(x, 1, '_', '#7A5C42');
    }
    for (let i = 0; i < 9; i++) {
      const mx = 4 + Math.floor(r() * (W - 8));
      g.put(mx - 1, 0, '(', '#C24E39'); g.put(mx, 0, '^', '#C24E39'); g.put(mx + 1, 0, ')', '#C24E39');
    }
    let x0 = 4;
    while (x0 < W - 4) {
      let x = x0;
      const len = 3 + Math.floor(r() * 4);
      for (let y = 2; y < 2 + len && y < H; y++) {
        const d = r() < 0.3 ? -1 : r() > 0.7 ? 1 : 0;
        g.put(x, y, d < 0 ? '/' : d > 0 ? '\\' : '|', '#5C4636');
        if (r() < 0.25) g.put(x + (r() < 0.5 ? -1 : 1), y, r() < 0.5 ? '~' : '.', '#7A5C42');
        x += d;
      }
      x0 += 6 + Math.floor(r() * 10);
    }
    for (let i = 0; i < 40; i++) g.put(Math.floor(r() * W), 2 + Math.floor(r() * (H - 2)), r() < 0.5 ? '.' : 'o', '#8C7C66');
    this._roots = this.toRows(g);
    return this._roots;
  }

  trail(seed) {
    this._trails = this._trails || {};
    if (this._trails[seed]) return this._trails[seed];
    const r = this.rng(seed);
    const runs = [];
    let t = '';
    for (let i = 0; i < 140; i++) {
      const p = r();
      if (i > 2 && p < 0.07) { if (t) runs.push({ t, c: '#3F8A52' }); t = ''; runs.push({ t: r() < 0.5 ? '&' : '%', c: '#2B7349' }); }
      else if (i > 2 && p < 0.085) { if (t) runs.push({ t, c: '#3F8A52' }); t = ''; runs.push({ t: '@', c: '#C24E39' }); }
      else t += r() < 0.8 ? '~' : '-';
    }
    if (t) runs.push({ t, c: '#3F8A52' });
    this._trails[seed] = runs;
    return runs;
  }

  // ---------------------------------------------------------------- geometry & the cutter
  // World units are millimetres. x runs to the lower right, y to the lower left, z up; the plate is a
  // fixed 2:1 isometric projection of it, so nothing ever rotates. Depth toward the viewer is x+y+z.
  K() { return { C: 3, S: 0.215, OX: 66, OY: 92, W: Math.round(this.D().PW / 3), H: Math.round(this.D().PH / 3) }; }
  P(x, y, z) { const K = this.K(); return [K.OX + (x - y) * K.S, K.OY + ((x + y) / 2 - z) * K.S]; }
  // A 3-D offset in mm as a 2-D shift in plate cells, whole cells so the grain of the cut stays put.
  shift(o) { const K = this.K(); return [Math.round((o[0] - o[1]) * K.S), Math.round(((o[0] + o[1]) / 2 - o[2]) * K.S)]; }
  rgb(hex) { return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)]; }
  mix(a, b, k) { return a.map((v, i) => Math.round(v * (1 - k) + b[i] * k)); }

  // Materials: three inks from light to dark, the crease colour, and how the tone of a face follows
  // the light (base + k * shadow). Above `hatch` a face is engraved with lines along its own axis.
  mats() {
    if (this._mats) return this._mats;
    const h = (x) => this.rgb(x), SAND = h('#F1ECDF');

  // The 34" panel bends on a 1500 mm radius, its ends reaching toward the viewer; a stand behind it.
  buildMonitor(out) {
    const M = this.mats(), BL = M.black, R = 1500, W = 808, Hh = 363, cx = 470, y0 = 150, z0 = 128, th = 22;
    out.push(...this.box(372, 30, 0, 196, 210, 9, BL, (tag, u, v) => tag === 'top' ? { t: 0.3 + (Math.floor(u / 22) % 2) * 0.04 } : undefined));
    out.push(...this.box(452, 62, 9, 36, 24, 236, BL));
    out.push(...this.box(400, 86, 190, 140, 50, 140, BL));
    const at = (u, off) => { const ph = (u - W / 2) / R; return [cx + (R + off) * Math.sin(ph) * 1, y0 + (R) * (1 - Math.cos(ph)) - off * Math.cos(ph)]; };
    const nrm = (u) => { const ph = (u - W / 2) / R; return [-Math.sin(ph), Math.cos(ph), 0]; };
    // The screen shows this very site, in its sand: a note open on the left, the garden map on the right.
    const r = this.rng('screen'), rows = [];
    for (let k = 0; k < 24; k++) rows.push({ l: 60 + r() * 230, c: r() < 0.12 ? '#1D5A8F' : '#8E8B7A', gap: r() < 0.18 });
    const dots = [];
    for (let k = 0; k < 24; k++) dots.push([560 + r() * 200, 60 + r() * 200, ['#C24E39', '#8A4F98', '#A87400', '#2A7099', '#B5476E', '#3F8A52'][Math.floor(r() * 6)]]);
    const PAGE = this.rgb('#F4EFE3');
    const screen = (tag, u, v, P, t, cx_, cy_) => {
      if (u < 7 || u > W - 7 || v < 16 || v > Hh - 7) return { t: 0.62, h: false };
      const top = Hh - 7 - v;                                    // mm down from the screen's top edge
      if (top < 22) { if (top > 9 && top < 15 && ((u > 40 && u < 120) || (u > 420 && u < 760 && (u - 420) % 58 < 40))) return { c: this.rgb(u < 130 ? '#1F2B23' : '#2B7349') }; return { c: PAGE, noEdge: true }; }
      if (u > 60 && u < 480) {
        if (top > 40 && top < 52 && u < 300) return { c: this.rgb('#1F2B23') };
        const row = Math.floor((top - 66) / 12), rr = rows[row];
        if (top > 66 && rr && !rr.gap && (top - 66) % 12 < 5 && u < 60 + rr.l + (row % 3) * 40) return { c: this.rgb(rr.c) };
      }
      if (u > 530 && u < 790) {
        for (const [dx, dy, c] of dots) { const d = Math.hypot(u - dx, top - dy); if (d < 5.5) return { c: this.rgb(c) }; }
        if (Math.abs(Math.sin(u * 0.045) * 40 + 120 - top) < 2.4 && (cx_ + cy_) % 2 === 0) return { c: this.rgb('#86A07A') };
        if (Math.abs(Math.cos(u * 0.03 + 1) * 50 + 170 - top) < 2.4 && (cx_ + cy_) % 2 === 0) return { c: this.rgb('#86A07A') };
      }
      return { c: PAGE, noEdge: true };
    };
    out.push({ A: W, B: Hh, tag: 'screen', mat: BL, tex: screen, fn: (u, v) => { const p = at(u, 0); return [[p[0], p[1], z0 + v], nrm(u)]; }, corners: [] });
    out.push({ A: W, B: th, tag: 'rim', mat: BL, tex: () => ({ t: 0.3 }), fn: (u, v) => { const p = at(u, v); return [[p[0], p[1], z0 + Hh], [0, 0, 1]]; }, corners: [] });
    out.push({ A: th, B: Hh, tag: 'end', mat: BL, tex: () => ({ t: 0.7 }), fn: (a, v) => { const p = at(W, a); return [[p[0], p[1], z0 + v], [Math.cos((W / 2) / R), Math.sin(W / 2 / R), 0]]; }, corners: [] });
    const cs = [];
    for (const u of [0, W / 2, W]) for (const off of [0, th]) for (const z of [z0, z0 + Hh]) { const p = at(u, off); cs.push([p[0], p[1], z]); }
    for (const s of out) if (!s.corners.length) s.corners = cs;
  }

  // The ThinkPad, open about 105 degrees: keys, the red TrackPoint and its three buttons, a terminal.
  buildLaptop(out, dec) {
    const M = this.mats(), BL = M.black, x0 = 420, y0 = 338, W = 324, D = 227, Hb = 18;
    const H = (hex) => this.rgb(hex), S = this.K().S;
    out.push(...this.box(x0, y0, 0, W, D, Hb, BL, (tag, u, v) => {
      if (tag !== 'top') return { t: 0.62 };

      if (rr && (L - 16 - v) % 12 < 4 && u > 18 && u < 18 + rr[0]) return { c: H(rr[1]) };

  // The desk: a walnut-oiled top, cut away at both ends, with engraved cast shadows on it.
  buildDesk(out) {
    const M = this.mats(), S = this.K().S, t = this.T();
    const casters = [[t[0], t[1], 0, t[0] + 215, t[1] + 447, 479], [400, 86, 190, 540, 136, 330], [65, 120, 128, 875, 170, 491], [420, 300, 0, 744, 342, 230], [420, 338, 0, 744, 565, 18], [452, 62, 0, 488, 86, 245]];
    const Lx = -0.33, Ly = 0.5, Lz = 0.8;
    const shadow = (x, y) => {
      for (const b of casters) {
        let tmin = 0, tmax = 1e9;
        for (const [o, dd, lo, hi] of [[x, Lx, b[0], b[3]], [y, Ly, b[1], b[4]], [0, Lz, b[2], b[5]]]) {
          if (Math.abs(dd) < 1e-9) { if (o < lo || o > hi) { tmax = -1; break; } continue; }
          let ta = (lo - o) / dd, tb2 = (hi - o) / dd; if (ta > tb2) [ta, tb2] = [tb2, ta];
          tmin = Math.max(tmin, ta); tmax = Math.min(tmax, tb2);
        }
        if (tmax > tmin) return true;
      }
      return false;
    };
    const X0 = -60, Y0 = -20, WW = 1640, DD = 700;
    out.push(...this.box(X0, Y0, -32, WW, DD, 32, M.desk, (tag, u, v, P, tone, cx, cy) => {
      const B4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5], b = B4[(cy & 3) * 4 + (cx & 3)];
      const sx = P[0] - P[1];
      const Kk = this.K();
      if (cx < 7 || cy < 7 || cx > Kk.W - 8 || cy > Kk.H - 8) return null;     // the desk runs out under the plate's rule
      if (tag === 'top') {
        if (shadow(P[0], P[1])) return { t: 0.55, h: (cx + cy) % 3 === 0, noEdge: true };
        const g = (v / 34 + Math.sin(u * 0.004 + Math.floor(v / 120)) * 0.8) % 1;
        return { t: g < 0.06 ? 0.4 : 0.0, h: false, noEdge: true };
      }
      if (tag === 'py') return { m: M.deskEdge, t: 0.45, h: Math.floor(u * S) % 3 === 0, noEdge: true };
      return { m: M.deskEdge, t: 0.7, noEdge: true };
    }));
  }

  // ---------------------------------------------------------------- layers, state and motion
  layerDefs() {

      { id: 'cpu', part: 'cpu', anchor: [20, 120, 377], slide: [120, 0, 0], ex: [130, 0, 40], lift: [10, 0, 6], tower: 1 },

      { id: 'shroud', part: 'case', anchor: [107, 220, 112], slide: [0, 0, 0], ex: [0, 0, 0], lift: [0, 0, 10], tower: 1 },
      { id: 'fans', part: 'kraken', anchor: [95, 424, 410], slide: [0, 0, 0], ex: [0, 150, 0], lift: [0, 8, 8], tower: 1 },
      { id: 'top', part: 'case', anchor: [107, 223, 469], slide: [0, 0, 0], ex: [0, 0, 80], lift: [0, 0, 10], tower: 1 },

  // Every layer cut three ways (at rest, lit in its part's colour, and as a phantom outline), once.
  sheets() {
    if (this._sheets) return this._sheets;
    const parts = {};
    for (const p of this.D().parts) parts[p.id] = p;
    const out = {};
    for (const L of this.layerDefs()) {
      const acc = parts[L.part].accent;
      const b = this.build(L.id), nh = L.part === 'case';
      out[L.id] = { rest: this.cut(b.surfs, 'rest', acc, b.decals, nh), lit: this.cut(b.surfs, 'lit', acc, b.decals, nh) };
      if (L.id === 'side' || L.id === 'shroud' || L.id === 'top') out[L.id].ghost = this.cut(b.surfs, 'ghost', acc);
      if (L.id === 'gpu') { const f = this.build('gpu', { flip: 1 }); out.gpu.flipRest = this.cut(f.surfs, 'rest', acc, f.decals); out.gpu.flipLit = this.cut(f.surfs, 'lit', acc, f.decals); }
    }
    this._sheets = out;
    return out;
  }

  // The plate's ground: paper grain, the double rule with its corner blooms, and the desk.
  ground() {
    if (this._ground) return this._ground;
    const K = this.K(), w = K.W, h = K.H;
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d'), img = ctx.createImageData(w, h), d = img.data;
    const set = (x, y, c) => { x = Math.round(x); y = Math.round(y); if (x < 0 || y < 0 || x >= w || y >= h) return; const i = (y * w + x) * 4; d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255; };
    const PAPER = this.rgb('#E6DECB'), RULE = this.rgb('#A99D84');
    const g = this.rng('desk-paper');
    for (let k = 0; k < w * h * 0.012; k++) set(g() * w, g() * h, PAPER);
    ctx.putImageData(img, 0, 0);
    const desk = this.build('desk'), dk = this.cut(desk.surfs, 'rest', '#7A5C42');
    ctx.drawImage(dk.cv, dk.x0, dk.y0);
    const img2 = ctx.getImageData(0, 0, w, h), d2 = img2.data;
    const set2 = (x, y, c) => { const i = (y * w + x) * 4; d2[i] = c[0]; d2[i + 1] = c[1]; d2[i + 2] = c[2]; d2[i + 3] = 255; };
    const m1 = 4, m2 = 6;
    for (let x = m1; x < w - m1; x++) { set2(x, m1, RULE); set2(x, h - 1 - m1, RULE); }
    for (let y = m1; y < h - m1; y++) { set2(m1, y, RULE); set2(w - 1 - m1, y, RULE); }
    for (let x = m2; x < w - m2; x++) if (x % 2 === 0) { set2(x, m2, RULE); set2(x, h - 1 - m2, RULE); }
    for (let y = m2; y < h - m2; y++) if (y % 2 === 0) { set2(m2, y, RULE); set2(w - 1 - m2, y, RULE); }
    for (const [cx, cy] of [[m1, m1], [w - 1 - m1, m1], [m1, h - 1 - m1], [w - 1 - m1, h - 1 - m1]])
      for (const [dx, dy] of [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]]) set2(cx + dx, cy + dy, dx || dy ? this.rgb('#C24E39') : this.rgb('#A87400'));
    ctx.putImageData(img2, 0, 0);
    this._ground = cv.toDataURL();
    return this._ground;
  }

  ease(t) { t = Math.max(0, Math.min(1, t)); return t * t * (3 - 2 * t); }
  val(k) { const v = this.state.v || {}; return v[k] || 0; }

  // Where each layer is now: its offset in mm, which sheet it shows, and how solid it is.
  placed() {
    const st = this.state, out = [], E = (k) => this.ease(this.val(k));
    const load = E('load'), panel = E('panel'), ex = E('ex');
    const shroudGhost = Math.max(ex, E('s:psu'));
    for (const L of this.layerDefs()) {
      const h = E('h:' + L.part), s = E('s:' + L.part);
      let o = [0, 0, 0];
      const addv = (v, k) => { o = [o[0] + v[0] * k, o[1] + v[1] * k, o[2] + v[2] * k]; };
      addv(L.lift, Math.max(h, s));
      addv(L.slide, s);
      addv(L.ex, ex);
      if (L.id === 'kraken') addv([230, 0, 0], E('s:cpu'));
      if (L.id === 'side') addv([110, 0, 60], panel);
      if (L.id === 'top') addv([0, 0, 170], panel);
      if (L.tower) addv([0, 0, 90], 1 - load);
      let ghost = 0;
      if (L.id === 'side' || L.id === 'top') ghost = panel;
      if (L.id === 'shroud') ghost = shroudGhost;
      out.push({ L, o, h: Math.max(h, s), s, ghost, op: L.tower ? load : 1 });
    }
    return out;
  }

  layers() {
    const K = this.K(), SH = this.sheets(), pct = (v, of) => (100 * v / of).toFixed(3) + '%', out = [];
    this.placed().forEach((q, i) => {
      const sh = SH[q.L.id], [dx, dy] = this.shift(q.o);
      const flip = q.L.id === 'gpu' && Math.hypot(...q.o) > 80;
      const solid = flip ? (q.h > 0.5 ? sh.flipLit : sh.flipRest) : (q.h > 0.5 ? sh.lit : sh.rest);
      const z = i + 1 + (q.s > 0.02 ? 40 : 0);
      const pos = (c) => 'left: ' + pct(c.x0 + dx, K.W) + '; top: ' + pct(c.y0 + dy, K.H) + '; width: ' + pct(c.w, K.W) + '; height: ' + pct(c.h, K.H) + ';';
      if (q.ghost < 0.999) out.push({ src: solid.url, style: pos(solid) + ' z-index: ' + z + '; opacity: ' + ((1 - q.ghost) * q.op).toFixed(3) + ';' });
      if (sh.ghost && q.ghost > 0.001) out.push({ src: sh.ghost.url, style: pos(sh.ghost) + ' z-index: ' + (q.L.id === 'side' || q.L.id === 'top' ? 60 : z) + '; opacity: ' + (q.ghost * q.op).toFixed(3) + ';' });
    });
    return out;
  }

  // Thin dotted leaders, along the isometric axes, from where each part sat to where it is now.
  leaders() {
    const K = this.K(), pl = this.placed().filter((q) => q.L.id !== 'side' && q.L.id !== 'top' && Math.hypot(...q.o) > 14 && (this.val('ex') > 0.01 || q.s > 0.01));
    const key = pl.map((q) => q.L.id + q.o.map((v) => Math.round(v)).join(',')).join('|');
    if (this._ldKey === key) return this._ld;
    const cv = document.createElement('canvas');
    cv.width = K.W; cv.height = K.H;
    const ctx = cv.getContext('2d'), img = ctx.createImageData(K.W, K.H), d = img.data;
    const RULE = this.rgb('#6E6450'), RED = this.rgb('#C24E39');
    const set = (x, y, c) => { x = Math.round(x); y = Math.round(y); if (x < 0 || y < 0 || x >= K.W || y >= K.H) return; const i = (y * K.W + x) * 4; d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255; };
    for (const q of pl) {
      const t = q.L.tower ? this.T() : [0, 0, 0], a = [q.L.anchor[0] + t[0], q.L.anchor[1] + t[1], q.L.anchor[2] + t[2]];
      let cur = a.slice(), k = 0;
      const p0 = this.P(...a);
      for (const [x, y] of [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]]) set(p0[0] + x, p0[1] + y, RED);
      for (let ax = 0; ax < 3; ax++) {
        if (Math.abs(q.o[ax]) < 1) continue;
        const nxt = cur.slice(); nxt[ax] += q.o[ax];
        const A = this.P(...cur), B = this.P(...nxt), n = Math.ceil(Math.hypot(B[0] - A[0], B[1] - A[1]));
        let last = '';
        for (let s = 0; s <= n; s++) {
          const x = Math.round(A[0] + (B[0] - A[0]) * s / n), y = Math.round(A[1] + (B[1] - A[1]) * s / n), kk = x + ',' + y;
          if (kk === last) continue; last = kk; k++;
          if (k % 3 === 0) set(x, y, RULE);
        }
        cur = nxt;
      }
    }
    ctx.putImageData(img, 0, 0);
    this._ldKey = key;
    this._ld = cv.toDataURL();
    return this._ld;
  }

  partOf(id) { return this.D().parts.find((p) => p.id === id); }

  // Hit areas: the convex outline of each layer as a clip-path, so a click lands on the part itself.
  hits() {
    const K = this.K(), SH = this.sheets(), pct = (v, of) => (100 * v / of).toFixed(3) + '%', out = [], panel = this.val('panel');
    const order = this.placed().map((q, i) => ({ q, i }));
    order.sort((a, b) => (a.q.L.part === 'case') - (b.q.L.part === 'case') || 0);
    const list = [];
    for (const { q, i } of order) {
      if ((q.L.id === 'side' || q.L.id === 'top') && panel > 0.5) continue;
      if (q.L.tower && q.L.part !== 'case' && panel < 0.5) continue;
      list.push({ q, i });
    }
    // Case parts lie lowest, so the parts inside win wherever they overlap the case.
    list.sort((a, b) => ((a.q.L.part === 'case' ? 0 : 1) - (b.q.L.part === 'case' ? 0 : 1)) || a.i - b.i);
    for (const { q } of list) {
      const c = SH[q.L.id].rest, [dx, dy] = this.shift(q.o), p = this.partOf(q.L.part);
      const clip = 'polygon(' + c.hull.map(([x, y]) => (100 * x / c.w).toFixed(1) + '% ' + (100 * y / c.h).toFixed(1) + '%').join(', ') + ')';
      out.push({ aria: p.name + ': ' + p.model, style: 'left: ' + pct(c.x0 + dx, K.W) + '; top: ' + pct(c.y0 + dy, K.H) + '; width: ' + pct(c.w, K.W) + '; height: ' + pct(c.h, K.H) + '; clip-path: ' + clip + ';',
        enter: () => this.go({ hover: p.id }), leave: () => this.go({ hover: '' }), pick: () => this.pick(p.id) });
    }
    return out;
  }

  // The caption of the hovered (or chosen) part: real text just above its anchor.
  caption() {
    const id = this.state.hover;
    if (!id) return { show: false };
    const K = this.K(), p = this.partOf(id), q = this.placed().filter((x) => x.L.part === id).sort((a, b) => b.L.anchor[2] - a.L.anchor[2])[0];
    const L = q.L, t = L.tower ? this.T() : [0, 0, 0], a = this.P(L.anchor[0] + t[0] + q.o[0], L.anchor[1] + t[1] + q.o[1], L.anchor[2] + t[2] + q.o[2]);
    const left = Math.max(4, Math.min(96, 100 * a[0] / K.W)), top = 100 * (a[1] - 5) / K.H;
    return { show: true, name: p.name, model: p.model, color: p.accent, style: 'left: ' + left.toFixed(2) + '%; top: ' + top.toFixed(2) + '%;' };
  }

  // Numbered call-outs, as in an assembly drawing, while the desk is exploded.
  callouts() {
    if (this.val('ex') < 0.6) return [];
    const K = this.K(), seen = new Set(), out = [];
    for (const q of this.placed()) {
      if (seen.has(q.L.part) || q.L.id === 'shroud' || q.L.id === 'side' || q.L.id === 'fans' || q.L.id === 'rad' || q.L.id === 'top') continue;
      seen.add(q.L.part);
      const p = this.partOf(q.L.part), t = q.L.tower ? this.T() : [0, 0, 0];
      const a = this.P(q.L.anchor[0] + t[0] + q.o[0], q.L.anchor[1] + t[1] + q.o[1], q.L.anchor[2] + t[2] + q.o[2]);
      out.push({ no: p.no, color: p.accent, style: 'left: ' + (100 * (a[0] + 3) / K.W).toFixed(2) + '%; top: ' + (100 * (a[1] - 8) / K.H).toFixed(2) + '%;' });
    }
    return out;
  }

  card() {
    const id = this.state.sel;
    if (!id) return { show: false };
    const p = this.partOf(id);
    return { show: true, no: p.no, name: p.name, model: p.model, color: p.accent, close: () => this.pick(id) };
  }

  key() {
    return this.D().parts.map((p) => ({ no: p.no, name: p.name, model: p.model, color: p.accent,
      weight: this.state.sel === p.id ? '600' : '400', pick: () => this.pick(p.id), enter: () => this.go({ hover: p.id }), leave: () => this.go({ hover: '' }) }));
  }

  // ---- motion: one small timer at 50 ms that runs only while something is still moving.
  targets() {
    const st = this.state, T = { load: 1, panel: this.val('load') > 0.92 ? 1 : 0, ex: st.ex ? 1 : 0 };
    for (const p of this.D().parts) { T['h:' + p.id] = st.hover === p.id ? 1 : 0; T['s:' + p.id] = st.sel === p.id ? 1 : 0; }
    return T;
  }
  boot() {
    this.rm = typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (this.props && this.props.motion === false) this.rm = true;
    this.state.v = this.rm ? { load: 1, panel: 1 } : { load: 0, panel: 0 };
    this.kick();
  }
  go(s) { this.setState(s); this.kick(); }
  pick(id) { this.go({ sel: this.state.sel === id ? '' : id }); }
  toggle() { this.go({ ex: !this.state.ex }); }
  kick() {
    if (this.rm) { const T = this.targets(), v = Object.assign({}, this.state.v, T); v.panel = 1; this.setState({ v }); return; }
    if (this.timer) return;
    this.timer = setInterval(() => this.step(), 50) || null;
  }
  step() {
    const T = this.targets(), v = Object.assign({}, this.state.v);
    let moving = false;
    for (const k in T) {
      const cur = v[k] || 0, d = T[k] - cur;
      const rate = k === 'load' ? 0.06 : k === 'panel' ? 0.045 : k === 'ex' ? 0.05 : k[0] === 's' ? 0.09 : 0.2;
      if (Math.abs(d) <= rate) v[k] = T[k]; else { v[k] = cur + Math.sign(d) * rate; moving = true; }
    }
    this.setState({ v });
    if (!moving) { clearInterval(this.timer); this.timer = null; }
  }

  // ---- the contact icons, cut from little sprites at the plate's 3-px grain.
  icon(name) {
    this._icons = this._icons || {};
    if (this._icons[name]) return this._icons[name];
    const S = {
      mail: ['xxxxxxxxxxx', 'xx.......xx', 'x.x.....x.x', 'x..x...x..x', 'x...x.x...x', 'x....x....x', 'x.........x', 'xxxxxxxxxxx'],
      gh: ['.....xxxxx.....', '...xxxxxxxxx...', '..x..xxxxx..x..', '.xx...xxx...xx.', '.xx.........xx.', 'xxx.........xxx', 'xxx.........xxx', 'xxx.........xxx', 'xxxx.......xxxx', '.x.xx.....xxxx.', '.xx.xx...xxxxx.', '..xx.....xxxx..', '...xx....xxx...', '.....x...x.....'],
      li: ['xxxxxxxxxx', 'x.xxxxxxxx', 'xxxxxxxxxx', 'x.xx.x..xx', 'x.xx..xx.x', 'x.xx.xxx.x', 'x.xx.xxx.x', 'x.xx.xxx.x', 'xxxxxxxxxx']
    }[name];
    const col = { mail: '#A87400', gh: '#1F2B23', li: '#1D5A8F' }[name];
    const cv = document.createElement('canvas');
    cv.width = S[0].length; cv.height = S.length;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = col;
    S.forEach((row, y) => [...row].forEach((ch, x) => { if (ch === 'x') ctx.fillRect(x, y, 1, 1); }));
    this._icons[name] = { url: cv.toDataURL(), w: S[0].length * 3, h: S.length * 3 };
    return this._icons[name];
  }

  D() { return this._d || (this._d = {"PW":1170,"PH":1000,"parts":[{"id":"case","name":"Case","model":"Fractal Design North, Charcoal Black","accent":"#7A5C42","layers":["shell","shroud","top","front","side"],"no":1},{"id":"mobo","name":"Motherboard","model":"ASUS B650E MAX GAMING WIFI","accent":"#5E8E4A","layers":["mobo"],"no":2},{"id":"cpu","name":"Processor","model":"AMD Ryzen 7 9800X3D","accent":"#A87400","layers":["cpu"],"no":3},{"id":"kraken","name":"Cooler","model":"NZXT Kraken Plus 280, black","accent":"#8A4F98","layers":["kraken","rad","fans"],"no":4},{"id":"ram","name":"Memory","model":"Kingston FURY Beast Black, 2 × 16 GB DDR5-6000 CL30","accent":"#B5476E","layers":["ram"],"no":5},{"id":"gpu","name":"Graphics card","model":"MSI GeForce RTX 5070 Ti 16G Ventus 3X OC","accent":"#3F8A52","layers":["gpu"],"no":6},{"id":"ssd","name":"SSD","model":"Samsung 990 EVO Plus 2 TB, M.2","accent":"#2A7099","layers":["ssd"],"no":7},{"id":"psu","name":"Power supply","model":"Corsair RM850x ATX 3.1","accent":"#C24E39","layers":["psu"],"no":8},{"id":"monitor","name":"Monitor","model":"GIGABYTE G34WQC2, 34\" curved ultrawide","accent":"#1D5A8F","layers":["monitor"],"no":9},{"id":"laptop","name":"Laptop","model":"Lenovo ThinkPad P14s Gen 2a","accent":"#C24E39","layers":["laptop"],"no":10}]}); }

  renderVals() {
    const ex = !!this.state.ex;
    return { ground: this.ground(), layers: this.layers(), leaders: this.leaders(), hits: this.hits(), caption: this.caption(), callouts: this.callouts(),
      card: this.card(), key: this.key(), toggle: () => this.toggle(), exLabel: ex ? '[ assemble ]' : '[ explode ]', exPressed: ex ? 'true' : 'false',
      icons: { mail: this.icon('mail'), gh: this.icon('gh'), li: this.icon('li') }, roots: this.roots() };
  }
}
