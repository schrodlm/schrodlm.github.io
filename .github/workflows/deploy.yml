name: Deploy the Astro site

# Inert until the switch-over: it runs only when started by hand, and only once it is on main.
# #46 moves it to `push: branches: [main]` and deletes pages.yml, the Jekyll deploy.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # Only the headless shell, without --with-deps: the runner has its libraries, and the CV page
      # brings its own fonts. Installing system packages made the Jekyll deploys slow (#10).
      - run: npx playwright install --only-shell chromium
      - run: npm run pdf
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
